services:

    # ─── Aplicación PHP-FPM ───────────────────────────────────────────
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: reporting_sys
        user: root
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
            - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
        networks:
            - laravel
        depends_on:
            db:
                condition: service_healthy

    # ─── Nginx ────────────────────────────────────────────────────────
    nginx:
        image: nginx:alpine
        container_name: reporting_nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - laravel
        depends_on:
            - app

    # ─── MySQL ────────────────────────────────────────────────────────
    db:
        image: mysql:8.0
        container_name: reporting_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-testing}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
            MYSQL_USER: ${DB_USERNAME:-laravel}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - "3307:3306"
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - laravel
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    laravel:
        driver: bridge

volumes:
    dbdata:
        driver: local
