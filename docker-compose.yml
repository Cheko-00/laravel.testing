services:
  testing-app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: testing_app
    image: testing-app:latest
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    working_dir: /var/www/app
    environment:
      APP_URL:  http://${HOST_IP:-localhost}:8002
    volumes:
      - .:/var/www/app
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - shared-network
  nginx:
    image: nginx:alpine
    container_name: testing-nginx
    restart: unless-stopped
    ports:
      - "8002:80"
    volumes:
      - .:/var/www/app
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - testing-app
    networks:
      - shared-network

networks:
  shared-network:
    driver: bridge